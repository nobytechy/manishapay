    <!--
      Fonts — loaded WITHOUT blocking first paint.

      A plain <link rel="stylesheet"> to Google Fonts blocks rendering on two
      round trips (googleapis for the CSS, gstatic for the files). On mobile
      data that was the single biggest delay before anything appeared on
      screen. Loading it as print media and flipping to all on load makes it
      non-blocking; display=swap means text renders immediately in the system
      font and reflows when Inter arrives.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
