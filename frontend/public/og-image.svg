<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <!-- background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0"   y1="100" x2="1200" y2="100"/>
    <line x1="0"   y1="200" x2="1200" y2="200"/>
    <line x1="0"   y1="300" x2="1200" y2="300"/>
    <line x1="0"   y1="400" x2="1200" y2="400"/>
    <line x1="0"   y1="500" x2="1200" y2="500"/>
    <line x1="200"  y1="0" x2="200"  y2="630"/>
    <line x1="400"  y1="0" x2="400"  y2="630"/>
    <line x1="600"  y1="0" x2="600"  y2="630"/>
    <line x1="800"  y1="0" x2="800"  y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- floating tech glyphs (faint) -->
  <g opacity="0.18" stroke="#10b981" stroke-width="2" fill="none">
    <polygon points="100,500 130,485 160,500 160,530 130,545 100,530"/>
    <circle cx="1080" cy="120" r="40"/>
    <circle cx="1080" cy="120" r="22"/>
    <polygon points="1050,520 1085,505 1120,520 1120,555 1085,570 1050,555"/>
  </g>

  <!-- logo block -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="16" fill="url(#brand)"/>
    <text x="36" y="50" text-anchor="middle" fill="white" font-size="36" font-weight="700">M</text>
  </g>
  <text x="170" y="135" fill="#f1f5f9" font-size="34" font-weight="600">ManishaPay</text>

  <!-- main heading -->
  <text x="80" y="290" fill="#f1f5f9" font-size="62" font-weight="700">PayNow Zimbabwe</text>
  <text x="80" y="365" font-size="62" font-weight="700">
    <tspan fill="#34d399">middleware</tspan>
    <tspan fill="#f1f5f9">, done right.</tspan>
  </text>

  <!-- subhead -->
  <text x="80" y="430" fill="#94a3b8" font-size="26" font-weight="400">Hash mismatches. Decimal bugs. Mobile OTP. Broken webhooks.</text>
  <text x="80" y="465" fill="#94a3b8" font-size="26" font-weight="400">Solved once at the integration layer.</text>

  <!-- footer band -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="585" fill="#64748b" font-size="22" font-weight="500">pay.aizim.co.zw</text>
  <text x="1120" y="585" text-anchor="end" fill="#64748b" font-size="22" font-weight="500">Built by Noby Tebulo · nobie.netlify.app</text>
</svg>
