# Netlify config — deploys the ManishaPay dashboard (frontend/) as a static SPA.
# The Node API is hosted separately (Render); the frontend talks to it via
# VITE_API_BASE (set in Netlify → Site settings → Environment variables).
#
# Required env vars on Netlify (Site settings → Environment variables):
#   VITE_SUPABASE_URL   = https://<new-project>.supabase.co
#   VITE_SUPABASE_ANON  = <new anon public key>
#   VITE_API_BASE       = https://<your-render-app>.onrender.com   (set AFTER the API is live)

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy the API + simulator to the Render backend, so the whole app lives under
# one domain (e.g. https://manishapay.netlify.app). Update the Render URL below
# to match your actual API service.
#   /api/v1/pay   → <render>/v1/pay     (the /api prefix is stripped by :splat)
#   /simulator/x  → <render>/simulator/x
[[redirects]]
  from = "/api/*"
  to = "https://manishapay-api.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/simulator/*"
  to = "https://manishapay-api.onrender.com/simulator/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes resolve to index.html.
# MUST stay last — the proxies above take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
